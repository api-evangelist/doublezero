aid: doublezero
name: DoubleZero
description: >-
  DoubleZero is a decentralized physical infrastructure network (DePIN) that
  builds and operates a global, permissionless, dedicated-fiber backbone for
  distributed systems like blockchains — delivering low-latency, high-throughput
  connectivity where milliseconds matter. Its two-ring architecture pairs
  edge-node filtering with private high-bandwidth transport, connecting Solana
  validators, RPCs, and market-data consumers directly to one another. The
  network is coordinated by onchain smart contracts on Solana and powered by the
  2Z SPL token, which meters bandwidth access, rewards fiber and device
  contributors for measured performance, and drives stake delegation. Operators
  connect through the first-party `doublezero` CLI and `doublezerod` daemon.
  Founded by Austin Federa with Malbec Labs; backed by Multicoin Capital and
  Dragonfly Capital.
